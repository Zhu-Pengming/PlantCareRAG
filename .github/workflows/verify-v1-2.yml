name: verify-v1-2-contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile v1.2 sources
        run: python -m compileall -q evaluation_v1_2
      - name: Validate v1.2 contracts
        run: |
          python evaluation_v1_2/scripts/validate_contract.py
          python evaluation_v1_2/scripts/validate_evidence_overlay.py
      - name: Run v1.2 contract smoke evaluation
        run: python evaluation_v1_2/scripts/evaluate_contract.py
      - name: Run v1.2 tests
        run: python -m unittest discover -s evaluation_v1_2/tests -v
